@if (card(); as face) {
  <span class="corner">
    <span class="rank">{{ face.rank }}</span>
    <span class="suit">{{ symbol() }}</span>
  </span>
  <span class="pip">{{ symbol() }}</span>
  <span class="corner corner--bottom">
    <span class="rank">{{ face.rank }}</span>
    <span class="suit">{{ symbol() }}</span>
  </span>
}
