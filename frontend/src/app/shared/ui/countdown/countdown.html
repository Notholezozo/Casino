<svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
  <circle class="ring__track" cx="18" cy="18" r="16" />
  <circle
    class="ring__value"
    cx="18"
    cy="18"
    r="16"
    pathLength="100"
    stroke-dasharray="100"
    [attr.stroke-dashoffset]="100 - progress()"
  />
</svg>
<span class="seconds">{{ seconds() }}</span>
