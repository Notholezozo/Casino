<p class="remaining" [class.is-done]="remaining() === 0" aria-live="polite">
  @if (remaining() > 0) {
    Encore <strong>{{ remaining() | drinks: unit() }}</strong> à distribuer
  } @else {
    Tout est réparti.
  }
</p>

<ul class="rows">
  @for (row of rows(); track row.player.id) {
    <li class="row">
      <button
        type="button"
        class="row__name"
        [disabled]="disabled() || remaining() === 0"
        [attr.aria-label]="'Donner tout le reste à ' + row.player.name"
        (click)="giveRemaining(row.player.id)"
      >
        {{ row.player.name }}
      </button>
      <button
        type="button"
        class="step"
        [disabled]="disabled() || row.amount === 0"
        [attr.aria-label]="'Retirer ' + one() + ' à ' + row.player.name"
        (click)="change(row.player.id, -1)"
      >
        −
      </button>
      <span class="row__amount">{{ row.amount }}</span>
      <button
        type="button"
        class="step"
        [disabled]="disabled() || remaining() === 0"
        [attr.aria-label]="'Donner ' + one() + ' à ' + row.player.name"
        (click)="change(row.player.id, 1)"
      >
        +
      </button>
    </li>
  }
</ul>

<button
  type="button"
  class="btn btn--primary btn--block"
  [disabled]="disabled() || remaining() !== 0"
  (click)="submit()"
>
  Distribuer {{ total() | drinks: unit() }}
</button>
