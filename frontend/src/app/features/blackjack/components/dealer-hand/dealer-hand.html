<span class="label">Croupier</span>
@if (hasCards()) {
  <div class="cards">
    @for (card of dealer().cards; track $index) {
      <app-playing-card [card]="card" />
    }
    @if (dealer().hasHiddenCard) {
      <app-playing-card />
    }
  </div>
  <div class="meta">
    <span class="total">{{ total() }}</span>
    @if (dealer().isBlackjack) {
      <span class="badge badge--gold">Blackjack</span>
    } @else if (dealer().isBust) {
      <span class="badge badge--danger">Sauté</span>
    }
  </div>
} @else {
  <div class="cards cards--empty" aria-hidden="true">
    <span class="slot"></span>
    <span class="slot"></span>
  </div>
}
