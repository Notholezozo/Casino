@if (view(); as v) {
  <app-table-layout
    title="Blackjack"
    [roundLabel]="'Manche ' + v.roundNumber"
    [phaseText]="phaseText()"
    [deadline]="store.deadline()"
    [reconnecting]="store.hubStatus() !== 'connected'"
    [tableCode]="v.tableCode"
    [players]="v.seats"
    [transfers]="v.transfers"
    [lobby]="v.roundNumber === 0"
    [busy]="store.busy()"
    [dealerMood]="dealerMood()"
    feltTitle="Blackjack pays 3 to 2"
    feltRule="Dealer stands on all 17s"
    (closeTable)="closeTable()"
  >
    <div tableMeter class="meter">
      <div class="meter__row">
        <span>Sabot</span>
        <span>{{ v.shoe.remaining }} / {{ v.shoe.total }}</span>
      </div>
      <div
        class="meter__bar"
        role="progressbar"
        aria-label="Cartes restantes dans le sabot"
        aria-valuemin="0"
        [attr.aria-valuemax]="v.shoe.total"
        [attr.aria-valuenow]="v.shoe.remaining"
      >
        <div class="meter__fill" [style.width.%]="shoePercent()"></div>
      </div>
      <p class="meter__note">Mises : {{ limitsText() }}</p>
    </div>

    <bj-dealer-hand tableDealer [dealer]="v.dealer" />

    @for (slot of seatSlots(); track slot.seat?.playerId ?? 'free-' + slot.index) {
      <bj-seat
        class="table-seat"
        [seat]="slot.seat"
        [phase]="v.phase"
        [dealRank]="slot.index"
        [style.--x]="slot.position.x + '%'"
        [style.--y]="slot.position.y + '%'"
        (kick)="kick(slot.seat!)"
      />
    }
  </app-table-layout>
} @else {
  <div class="loading">
    <p>Connexion à la table…</p>
    <a class="btn btn--ghost" routerLink="/">Retour à l'accueil</a>
  </div>
}

@if (store.error(); as error) {
  <p class="toast" role="alert">Erreur : {{ error }}</p>
}
